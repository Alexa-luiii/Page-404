<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05060f;
            --blue: #4f8eff;
            --yellow: #ffd166;
            --red: #ff6b6b;
            --text-white: #ffffff;
            --text-muted: #666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            z-index: 1;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            background: rgba(79, 142, 255, 0.1);
            color: var(--blue);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(to bottom, #fff, var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: var(--text-white);
            opacity: 0.9;
        }

        .game-card {
            background: rgba(10, 11, 24, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 2rem;
            position: relative;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        #gc {
            width: 100%;
            height: auto;
            aspect-ratio: 660 / 230;
            background: #080914;
            border-radius: 8px;
            display: block;
            touch-action: none;
        }

        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 2rem;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 100px;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home {
            background-color: var(--blue);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(79, 142, 255, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 142, 255, 0.5);
        }

        .btn-retry {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-retry:hover {
            border-color: var(--text-white);
            color: var(--text-white);
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>

    <div class="container">
        <div class="badge">ERROR 404</div>
        <h1>Lost.</h1>
        <p class="subtitle">"This page drifted into the void — but you don't have to."</p>

        <div class="game-card">
            <div class="game-header">
                <div id="score">score 0</div>
                <div id="hi-score">best: 0</div>
            </div>
            <canvas id="gc" width="660" height="230"></canvas>
        </div>

        <div class="controls">
            <a href="index.html" class="btn btn-home">← Take me home</a>
            <button class="btn btn-retry" onclick="resetGame()">↻ Try again</button>
        </div>

        <footer>
            "// you were looking for something that no longer exists"
        </footer>
    </div>

    <script>
        // --- Star Field Background ---
        const starsCanvas = document.getElementById('stars');
        const sCtx = starsCanvas.getContext('2d');

        function resizeStars() {
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight;
            drawStars();
        }

        function drawStars() {
            sCtx.fillStyle = '#05060f';
            sCtx.fillRect(0, 0, starsCanvas.width, starsCanvas.height);
            sCtx.fillStyle = '#ffffff';
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * starsCanvas.width;
                const y = Math.random() * starsCanvas.height;
                const size = Math.random() * 1.5;
                const opacity = Math.random();
                sCtx.globalAlpha = opacity;
                sCtx.beginPath();
                sCtx.arc(x, y, size, 0, Math.PI * 2);
                sCtx.fill();
            }
            sCtx.globalAlpha = 1.0;
        }
        window.addEventListener('resize', resizeStars);
        resizeStars();

        // --- Space Dodge Game ---
        const canvas = document.getElementById('gc');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const hiScoreEl = document.getElementById('hi-score');

        // Game State
        let score = 0;
        let hiScore = 0;
        let alive = true;
        let frameCount = 0;
        let ship = { x: 90, y: canvas.height / 2, vx: 0, vy: 0 };
        let asteroids = [];
        let particles = [];
        let keys = {};
        let touchStart = null;

        // Controls
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' && !alive) resetGame();
        });

        canvas.addEventListener('touchstart', e => {
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            if (!touchStart) return;
            const dx = e.touches[0].clientX - touchStart.x;
            const dy = e.touches[0].clientY - touchStart.y;

            keys['ArrowRight'] = dx > 20;
            keys['ArrowLeft'] = dx < -20;
            keys['ArrowDown'] = dy > 20;
            keys['ArrowUp'] = dy < -20;

            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            touchStart = null;
            keys['ArrowRight'] = false;
            keys['ArrowLeft'] = false;
            keys['ArrowDown'] = false;
            keys['ArrowUp'] = false;
            if (!alive) resetGame();
            e.preventDefault();
        }, { passive: false });

        function resetGame() {
            score = 0;
            alive = true;
            frameCount = 0;
            ship = { x: 90, y: canvas.height / 2, vx: 0, vy: 0 };
            asteroids = [];
            particles = [];
            updateScoreUI();
        }

        function createAsteroid() {
            const r = 10 + Math.random() * 15;
            const speed = 1.8 + Math.random() * 2.2 + score * 0.003;
            // 7-point polygon radius variation
            const jags = [];
            for (let i = 0; i < 7; i++) jags.push(r * (0.8 + Math.random() * 0.4));

            asteroids.push({
                x: canvas.width + r,
                y: Math.random() * canvas.height,
                r: r,
                speed: speed,
                jags: jags,
                rot: 0,
                rotSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function spawnParticles(x, y) {
            for (let i = 0; i < 18; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.03
                });
            }
        }

        function updateScoreUI() {
            scoreEl.innerText = `score ${Math.floor(score)}`;
            hiScoreEl.innerText = `best: ${Math.floor(hiScore)}`;
        }

        function gameLoop() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (alive) {
                // Update Ship
                let inputX = 0;
                let inputY = 0;
                if (keys['KeyW'] || keys['ArrowUp']) inputY -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) inputY += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) inputX -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) inputX += 1;

                ship.vx = ship.vx * 0.80 + inputX * 0.7;
                ship.vy = ship.vy * 0.80 + inputY * 0.7;
                ship.x += ship.vx;
                ship.y += ship.vy;

                // Bounds
                if (ship.x < 15) ship.x = 15;
                if (ship.x > canvas.width - 15) ship.x = canvas.width - 15;
                if (ship.y < 15) ship.y = 15;
                if (ship.y > canvas.height - 15) ship.y = canvas.height - 15;

                score++;
                if (score > hiScore) hiScore = score;
                updateScoreUI();

                // Spawn Asteroids
                let spawnRate = Math.max(18, Math.floor(55 - score / 200));
                if (frameCount % spawnRate === 0) {
                    createAsteroid();
                }
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = `#ffd166`;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // Update & Draw Asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.x -= a.speed;
                a.rot += a.rotSpeed;

                if (a.x < -a.r * 2) {
                    asteroids.splice(i, 1);
                    continue;
                }

                // Collision
                if (alive) {
                    const dx = ship.x - a.x;
                    const dy = ship.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < a.r + 9) {
                        alive = false;
                        spawnParticles(ship.x, ship.y);
                    }
                }

                // Draw Asteroid
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.rot);
                ctx.beginPath();
                for (let j = 0; j < 7; j++) {
                    const angle = (j / 7) * Math.PI * 2;
                    const r = a.jags[j];
                    if (j === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fillStyle = '#161829';
                ctx.fill();
                ctx.strokeStyle = '#2d314d';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            // Draw Ship
            if (alive) {
                ctx.save();
                ctx.translate(ship.x, ship.y);

                // Thruster
                if (frameCount % 4 < 3) {
                    ctx.fillStyle = '#ffd166';
                    ctx.beginPath();
                    ctx.moveTo(-12, 0);
                    ctx.lineTo(-20 - Math.random() * 10, 0);
                    ctx.lineTo(-12, 6);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(-12, 0);
                    ctx.lineTo(-20 - Math.random() * 10, 0);
                    ctx.lineTo(-12, -6);
                    ctx.fill();
                }

                // Ship body
                ctx.fillStyle = '#4f8eff';
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-10, 10);
                ctx.lineTo(-5, 0);
                ctx.lineTo(-10, -10);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            } else {
                // Death Screen Overlay
                ctx.fillStyle = 'rgba(5, 6, 15, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff6b6b';
                ctx.font = '800 24px Syne';
                ctx.textAlign = 'center';
                ctx.fillText('SHIP DESTROYED', canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Space Mono';
                ctx.fillText(`score ${Math.floor(score)} • best ${Math.floor(hiScore)}`, canvas.width / 2, canvas.height / 2 + 15);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillText('[ space ] to retry', canvas.width / 2, canvas.height / 2 + 45);
                ctx.textAlign = 'left'; // reset
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();

    </script>
</body>
</html>
